<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #131211;
    color: #f2eee9;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; inset: -30% 40% 30% -20%;
    background: radial-gradient(closest-side, rgba(240,169,60,.16), transparent 70%);
  }
  .motivo {
    position: absolute; right: -110px; bottom: -95px; width: 660px; opacity: .2;
    -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 55%, transparent 100%);
  }
  .wrap { position: relative; padding: 72px 78px; height: 100%; display: flex; flex-direction: column; }
  .eyebrow {
    display: flex; align-items: center; gap: 11px;
    font-size: 19px; font-weight: 700; letter-spacing: .13em;
    text-transform: uppercase; color: #f0a93c;
  }
  .eyebrow i { width: 11px; height: 11px; border-radius: 50%; background: #f0a93c; display: block; }
  .trato { margin-top: 34px; font-size: 27px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #f0a93c; }
  h1 { font-size: 74px; line-height: 1.03; letter-spacing: -.035em; font-weight: 800; margin-top: 8px; }
  .rol {
    margin-top: 22px; font-size: 30px; font-weight: 650; line-height: 1.28;
    letter-spacing: -.015em; max-width: 21.5em;
    background: linear-gradient(104deg, #f0a93c 12%, #b79cff 78%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pie {
    margin-top: auto; display: flex; align-items: center; gap: 18px;
    font-size: 21px; color: #b8b0a6; letter-spacing: .01em;
  }
  .pie b { color: #f2eee9; font-weight: 650; }
  .sep { width: 5px; height: 5px; border-radius: 50%; background: #46403a; }
</style>
</head>
<body>
  <div class="glow"></div>

  <svg class="motivo" viewBox="0 0 640 520" fill="none">
    <g stroke="#f0a93c" stroke-linecap="round">
      <ellipse cx="400" cy="260" rx="228" ry="196" stroke-width="1.6" opacity=".5"  stroke-dasharray="6 14"/>
      <ellipse cx="400" cy="260" rx="176" ry="150" stroke-width="1.6" opacity=".75" stroke-dasharray="5 12"/>
    </g>
    <g stroke="#b79cff" stroke-linecap="round">
      <path d="M-30 372C86 436 190 296 300 372s224-72 400 -16" stroke-width="2.6" opacity=".45"/>
      <path d="M-30 372C86 436 190 296 300 372s224-72 400 -16" stroke-width="15" stroke-dasharray="0.01 27"/>
      <path d="M-30 138C92 46 208 178 320 96s232 52 380 -18" stroke-width="2.6" opacity=".45"/>
      <path d="M-30 138C92 46 208 178 320 96s232 52 380 -18" stroke-width="15" stroke-dasharray="0.01 27"/>
    </g>
    <g fill="#f0a93c">
      <circle cx="479" cy="290" r="21"/><circle cx="451" cy="329" r="21"/>
      <circle cx="400" cy="338" r="21"/><circle cx="349" cy="329" r="21"/>
      <circle cx="321" cy="290" r="21"/><circle cx="321" cy="230" r="21"/>
      <circle cx="349" cy="191" r="21"/><circle cx="400" cy="182" r="21"/>
      <circle cx="451" cy="191" r="21"/><circle cx="479" cy="230" r="21"/>
      <circle cx="442" cy="260" r="21"/><circle cx="421" cy="224" r="21"/>
      <circle cx="379" cy="224" r="21"/><circle cx="358" cy="260" r="21"/>
      <circle cx="379" cy="296" r="21"/><circle cx="421" cy="296" r="21"/>
      <circle cx="400" cy="260" r="21"/>
    </g>
  </svg>

  <div class="wrap">
    <p class="eyebrow"><i></i>San Rafael, Mendoza · Argentina</p>
    <p class="trato">Dra. Ing.</p>
    <h1>Paola Beatriz Torres</h1>
    <p class="rol">Simulación computacional de biomoléculas &amp; Machine Learning</p>
    <div class="pie">
      <span><b>Investigadora Posdoctoral</b> CONICET</span>
      <span class="sep"></span>
      <span>paobtorres.github.io</span>
    </div>
  </div>
</body>
</html>
